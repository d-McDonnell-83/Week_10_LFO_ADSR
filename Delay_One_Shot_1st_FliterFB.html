<!doctype html>

<head>
<meta charset="utf-8">
<title>ADSR Delay Voice</title>
<style>body{background:#fff;color:#000}</style>

  </head>
    <body>

<button id="trig" type="button">Play note</button>

<p>
Delay time <input id="time" type="range" min="10" max="2000" value="350">
<br>
Feedback <input id="fb" type="range" min="0" max="95" value="50">
<br>
Modultor <input id="fb" type="range" min="0" max="95" value="50">
</p>


<script>

const ctx = new AudioContext();

const master = new GainNode(ctx)
master.gain.value = 0.01;


const delay = new DelayNode(ctx)

delay.delayTime = 0.35

const feedback = new GainNode(ctx)
feedback.gain.value = 0.5;

const DelFilter = new BiquadFilterNode(ctx)
DelFilter.type = "highpass"
DelFilter.frequency.value = 4000;


delay.connect(feedback);
feedback.connect(DelFilter);
DelFilter.connect(delay);


delay.connect(master);
master.connect(ctx.destination);

// Everything above is built once. The code below runs on every click
// and builds a brand new note each time.
document.getElementById('trig').addEventListener('click', function () {

  ctx.resume();

  // "Now" on the audio clock. All the timings below are offsets from this.
  const t = ctx.currentTime;


  const osc1 = new OscillatorNode(ctx)
  osc1.type = "sawtooth";
  osc1.frequency.value = 65;

  const filter = new BiquadFilterNode(ctx);
  filter.type = "lowpass"
  filter.frequency.value = 4000
  filter.Q = 50

  const filterLFO = new OscillatorNode(ctx);
  filterLFO.type = "sine";
  filterLFO.frequency.value = 4 

  const LFOdepth = new GainNode(ctx);
  LFOdepth.gain.value = 800

  filterLFO.connect(LFOdepth);
  LFOdepth.connect(filter.frequency);

  const dur = 10
  const env = new GainNode(ctx)
  env.gain.value = 0;

  env.gain.setValueAtTime(0, t);                     // start silent
  env.gain.linearRampToValueAtTime(1, t + dur*0.5);     // Attack
  env.gain.linearRampToValueAtTime(0.3, t + dur*0.55);    // Decay
  //env.gain.setValueAtTime(0.2, t + dur*0.9);             // Sustain
  env.gain.linearRampToValueAtTime(0, t + dur);      // Release

  osc1.connect(filter);
  filter.connect(env);
  env.connect(master);  // straight to the speakers (the "dry" sound)
  env.connect(delay);   // into the delay loop (the echoes, or "wet" sound)

  // Start the tone now, and stop it just after the release has finished.
  // A stopped node with nothing referring to it is cleaned up by the browser.
  osc1.start(t);
  filterLFO.start(t);
  osc1.stop(t + dur);
  filterLFO.stop(t + dur);
});

// Delay time slider. Its value is in milliseconds, so divide by 1000 for
// seconds. setTargetAtTime glides toward the new value instead of jumping,
// which avoids clicks. The 0.05 sets how fast it glides (smaller is faster).
document.getElementById('time').addEventListener('input', function (e) {
  delay.delayTime.setTargetAtTime(e.target.value / 1000, ctx.currentTime, 0.05);
});

// Feedback slider. Its value runs 0 to 95, so divide by 100 for a gain
// between 0 and 0.95. The cap at 0.95 keeps the echo loop from running away.
document.getElementById('fb').addEventListener('input', function (e) {
  feedback.gain.setTargetAtTime(e.target.value / 100, ctx.currentTime, 0.02);
});
</script>

</body>
</html>
